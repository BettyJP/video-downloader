name: Build and Release Multi-OS Packages

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Windows x86_64 Standalone Package (Python runtime + ffmpeg.exe bundled)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download static FFmpeg for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "bin/ffmpeg.exe" -Force
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_extracted

      - name: Install dependencies and build package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python build.py --clean --archive --target-name vdl-windows-x86_64

      - name: Verify built Windows executable
        shell: pwsh
        run: |
          .\dist\vdl\vdl.exe --version
          .\dist\vdl\vdl.exe --help

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: vdl-windows-x86_64
          path: dist/releases/vdl-windows-x86_64.zip

  # ---------------------------------------------------------------------------
  # 2. Ubuntu x86_64 Standalone Package (Python runtime + static ffmpeg bundled)
  # ---------------------------------------------------------------------------
  build-ubuntu:
    name: Build Ubuntu (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download static FFmpeg for Linux
        run: |
          mkdir -p bin
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg bin/ffmpeg
          chmod +x bin/ffmpeg
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

      - name: Install dependencies and build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python build.py --clean --archive --target-name vdl-ubuntu-x86_64

      - name: Verify built Ubuntu executable
        run: |
          ./dist/vdl/vdl --version
          ./dist/vdl/vdl --help

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v6
        with:
          name: vdl-ubuntu-x86_64
          path: dist/releases/vdl-ubuntu-x86_64.tar.gz

  # ---------------------------------------------------------------------------
  # 3. CentOS / RHEL Compatible x86_64 Package (Built on EL8 / glibc 2.28)
  # ---------------------------------------------------------------------------
  build-centos:
    name: Build CentOS / RHEL (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build CentOS package inside AlmaLinux 8 container
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace almalinux:8 bash -euxc '
            dnf install -y epel-release
            dnf install -y python3.12 python3.12-pip python3.12-devel gcc git curl tar xz binutils findutils
            mkdir -p bin
            curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
            tar -xf ffmpeg.tar.xz
            cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg bin/ffmpeg
            chmod +x bin/ffmpeg
            rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl
            python3.12 -m pip install --upgrade pip
            python3.12 -m pip install -r requirements.txt
            python3.12 -m pip install -e .
            python3.12 build.py --clean --archive --target-name vdl-centos-x86_64
            ./dist/vdl/vdl --version
            ./dist/vdl/vdl --help
          '

      - name: Upload CentOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: vdl-centos-x86_64
          path: dist/releases/vdl-centos-x86_64.tar.gz

  # ---------------------------------------------------------------------------
  # 4. Publish GitHub Release (Tag derived from pyproject.toml `version`)
  # ---------------------------------------------------------------------------
  release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-ubuntu, build-centos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version from pyproject.toml
        id: meta
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_NAME="v${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected release tag from pyproject.toml: $TAG_NAME"

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release_assets
          sha256sum vdl-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release_assets/vdl-windows-x86_64.zip \
              release_assets/vdl-ubuntu-x86_64.tar.gz \
              release_assets/vdl-centos-x86_64.tar.gz \
              release_assets/SHA256SUMS.txt \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG_NAME" \
              release_assets/vdl-windows-x86_64.zip \
              release_assets/vdl-ubuntu-x86_64.tar.gz \
              release_assets/vdl-centos-x86_64.tar.gz \
              release_assets/SHA256SUMS.txt \
              --target "${{ github.sha }}" \
              --title "$TAG_NAME" \
              --generate-notes --repo "${{ github.repository }}"
          fi
