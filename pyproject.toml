[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vdl"
version = "1.1.1"
description = "Custom Video Downloader with HTML/API parser, Browser Network Sniffer, and Standalone Packaging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Video Downloader Team" }
]
dependencies = [
    "httpx[http2]>=0.27.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.45.0",
    "yt-dlp>=2024.8.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.8.0",
]

[project.urls]
Homepage = "https://github.com/BettyJP/video-downloader"
Repository = "https://github.com/BettyJP/video-downloader"
Releases = "https://github.com/BettyJP/video-downloader/releases"

[project.scripts]
vdl = "vdl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

